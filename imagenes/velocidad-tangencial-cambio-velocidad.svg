<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Velocidad tangencial y origen de la aceleración centrípeta</title>
<desc id="desc">A la izquierda se muestran dos posiciones cercanas sobre una circunferencia, sus radios y velocidades tangentes. A la derecha, las velocidades de igual módulo se dibujan desde un origen común y el cambio de velocidad apunta aproximadamente hacia el centro de la órbita.</desc>
<defs>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L10,4 z" fill="#16845b"/>
  </marker>
  <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L10,4 z" fill="#475569"/>
  </marker>
  <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L10,4 z" fill="#d97706"/>
  </marker>
</defs>
<rect width="1100" height="500" rx="22" fill="#f8fafc"/>
<text x="550" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#172033">En el movimiento circular, la rapidez puede ser constante y la velocidad cambia</text>
<line x1="550" y1="76" x2="550" y2="420" stroke="#cbd5e1" stroke-width="2"/>

<text x="280" y="92" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">1. La velocidad instantánea es tangente</text>
<circle cx="260" cy="282" r="145" fill="#eef5fb" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
<circle cx="260" cy="282" r="7" fill="#172033"/>
<text x="239" y="311" font-family="sans-serif" font-size="20" fill="#172033">O</text>
<line x1="260" y1="282" x2="405" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#arrowDark)"/>
<text x="330" y="270" font-family="sans-serif" font-size="20" font-weight="700" fill="#475569">r</text>
<line x1="260" y1="282" x2="362" y2="179" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M405 282 A145 145 0 0 0 362 179" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="7 6"/>
<text x="388" y="219" font-family="sans-serif" font-size="18" fill="#b45309">arco Δs</text>
<circle cx="405" cy="282" r="9" fill="#e67e22" stroke="#9a3412" stroke-width="2"/>
<circle cx="362" cy="179" r="9" fill="#e67e22" stroke="#9a3412" stroke-width="2"/>
<text x="415" y="306" font-family="sans-serif" font-size="18" fill="#172033">A</text>
<text x="370" y="167" font-family="sans-serif" font-size="18" fill="#172033">B</text>
<line x1="405" y1="282" x2="405" y2="190" stroke="#16845b" stroke-width="5" marker-end="url(#arrowGreen)"/>
<text x="415" y="207" font-family="sans-serif" font-size="20" font-weight="700" fill="#16845b">v_A</text>
<line x1="362" y1="179" x2="297" y2="114" stroke="#16845b" stroke-width="5" marker-end="url(#arrowGreen)"/>
<text x="278" y="121" font-family="sans-serif" font-size="20" font-weight="700" fill="#16845b">v_B</text>
<text x="270" y="386" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">v es perpendicular a r y sigue la tangente</text>
<text x="270" y="414" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">al hacer Δt muy pequeño, la cuerda se aproxima al arco</text>

<text x="825" y="92" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">2. El cambio de velocidad apunta hacia dentro</text>
<circle cx="690" cy="295" r="6" fill="#172033"/>
<text x="670" y="324" font-family="sans-serif" font-size="18" fill="#172033">mismo origen</text>
<line x1="690" y1="295" x2="690" y2="155" stroke="#16845b" stroke-width="5" marker-end="url(#arrowGreen)"/>
<text x="700" y="170" font-family="sans-serif" font-size="19" font-weight="700" fill="#16845b">v_A</text>
<line x1="690" y1="295" x2="590" y2="195" stroke="#16845b" stroke-width="5" marker-end="url(#arrowGreen)"/>
<text x="559" y="192" font-family="sans-serif" font-size="19" font-weight="700" fill="#16845b">v_B</text>
<line x1="690" y1="155" x2="590" y2="195" stroke="#d97706" stroke-width="5" marker-end="url(#arrowOrange)"/>
<text x="625" y="157" font-family="sans-serif" font-size="20" font-weight="700" fill="#b45309">Δv</text>
<text x="840" y="190" font-family="sans-serif" font-size="18" fill="#334155">|v_A| = |v_B| = v</text>
<text x="840" y="222" font-family="sans-serif" font-size="18" fill="#334155">solo cambia la dirección</text>
<text x="840" y="254" font-family="sans-serif" font-size="18" fill="#334155">Δv apunta hacia el centro</text>
<rect x="735" y="290" width="315" height="108" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="892" y="330" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Relaciones que se obtienen</text>
<text x="892" y="365" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#16845b">v_t = rω</text>
<text x="892" y="391" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#b45309">a_c = v²/r</text>
</svg>
