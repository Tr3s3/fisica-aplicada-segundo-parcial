<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Desplazamiento y presión en una onda sonora longitudinal</title>
<desc id="desc">Las partículas del aire oscilan paralelas a la propagación. Las regiones comprimidas tienen variación de presión positiva. Se relacionan por delta p máxima igual a B k s máxima.</desc>
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245bdb"/></marker>
</defs>
<rect width="900" height="430" rx="24" fill="#f8fafc"/>
<text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#172033">Sonido: las partículas se mueven paralelas a la onda</text>
<line x1="95" y1="155" x2="805" y2="155" stroke="#94a3b8" stroke-width="2"/>
<g fill="#245bdb">
<circle cx="115" cy="155" r="7"/><circle cx="154" cy="155" r="7"/><circle cx="193" cy="155" r="7"/>
<circle cx="292" cy="155" r="7"/><circle cx="302" cy="155" r="7"/><circle cx="312" cy="155" r="7"/><circle cx="322" cy="155" r="7"/>
<circle cx="364" cy="155" r="7"/><circle cx="406" cy="155" r="7"/>
<circle cx="505" cy="155" r="7"/><circle cx="515" cy="155" r="7"/><circle cx="525" cy="155" r="7"/><circle cx="535" cy="155" r="7"/>
<circle cx="577" cy="155" r="7"/><circle cx="619" cy="155" r="7"/>
<circle cx="718" cy="155" r="7"/><circle cx="757" cy="155" r="7"/><circle cx="796" cy="155" r="7"/>
</g>
<rect x="278" y="112" width="60" height="86" rx="10" fill="#fee2e2" opacity=".8"/>
<rect x="491" y="112" width="60" height="86" rx="10" fill="#fee2e2" opacity=".8"/>
<text x="308" y="218" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#b91c1c">compresión</text>
<text x="521" y="218" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#b91c1c">compresión</text>
<line x1="430" y1="100" x2="650" y2="100" stroke="#245bdb" stroke-width="4" marker-end="url(#arr)"/>
<text x="540" y="87" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#245bdb">propagación</text>
<text x="450" y="270" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172033">presión:   alta en compresión · baja en rarefacción</text>
<path d="M110 350 C160 350 175 300 225 300 S290 400 340 400 S405 300 455 300 S520 400 570 400 S635 300 685 300 S750 350 800 350" fill="none" stroke="#198754" stroke-width="5"/>
<line x1="110" y1="350" x2="800" y2="350" stroke="#94a3b8" stroke-width="2"/>
<text x="145" y="322" font-family="sans-serif" font-size="16" fill="#198754">Δp</text>
<text x="450" y="420" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Δpₘₐₓ = B k sₘₐₓ</text>
</svg>