<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Campo gravitatorio de dos masas en posiciones distintas</title>
<desc id="desc">En el origen, una masa ubicada al oeste produce campo hacia el oeste y otra masa al norte produce campo hacia el norte. La resultante apunta al noroeste. El dibujo no está a escala para los módulos.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245bdb"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#198754"/></marker></defs>
<rect width="900" height="440" rx="24" fill="#f8fafc"/>
<text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#172033">Campo en el origen: asigna signos antes de sumar</text>
<line x1="150" y1="300" x2="690" y2="300" stroke="#64748b" stroke-width="2"/><polygon points="690,300 676,293 676,307" fill="#64748b"/><text x="700" y="306" font-family="sans-serif" font-size="18" fill="#334155">+x (este)</text>
<line x1="370" y1="380" x2="370" y2="75" stroke="#64748b" stroke-width="2"/><polygon points="370,75 363,89 377,89" fill="#64748b"/><text x="382" y="86" font-family="sans-serif" font-size="18" fill="#334155">+y (norte)</text>
<circle cx="370" cy="300" r="9" fill="#172033"/><text x="386" y="327" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">O (0,0)</text>
<circle cx="190" cy="300" r="26" fill="#f4a261" stroke="#b45309" stroke-width="3"/><text x="190" y="347" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7c2d12">M₁ (−3,0) km</text>
<circle cx="370" cy="80" r="26" fill="#f4a261" stroke="#b45309" stroke-width="3"/><text x="445" y="84" font-family="sans-serif" font-size="18" fill="#7c2d12">M₂ (0,4) km</text>
<line x1="353" y1="300" x2="230" y2="300" stroke="#245bdb" stroke-width="6" marker-end="url(#a)"/><text x="285" y="284" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#245bdb">g₁: −x</text>
<line x1="370" y1="317" x2="370" y2="200" stroke="#245bdb" stroke-width="6" marker-end="url(#a)"/><text x="390" y="230" font-family="sans-serif" font-size="18" fill="#245bdb">g₂: +y</text>
<line x1="360" y1="290" x2="295" y2="225" stroke="#198754" stroke-width="6" marker-end="url(#b)"/><text x="275" y="205" font-family="sans-serif" font-size="18" font-weight="700" fill="#198754">g neta</text>
<path d="M325 300 A45 45 0 0 0 338 270" fill="none" stroke="#e67e22" stroke-width="3"/><text x="305" y="263" font-family="sans-serif" font-size="17" fill="#b45309">θ</text>
<text x="450" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Direcciones ilustrativas, no a escala · θ se mide al norte del oeste</text>
</svg>