<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Comparación de los movimientos en el efecto Doppler acústico</title>
<desc id="desc">Tres esquemas separan el efecto de una fuente que se acerca, un observador que se acerca y fuente y observador que se alejan. Las velocidades se miden respecto del aire.</desc>
<defs>
  <marker id="arrow-source" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
    <path d="M0,0 L0,10 L10,5 z" fill="#c2410c"/>
  </marker>
  <marker id="arrow-observer" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
    <path d="M0,0 L0,10 L10,5 z" fill="#15803d"/>
  </marker>
</defs>
<rect width="1000" height="700" rx="24" fill="#f8fafc"/>
<text x="500" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#172033">Doppler acústico: la fuente y el observador actúan distinto</text>
<text x="500" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">El aire define el medio de referencia; las velocidades se miden respecto del aire.</text>

<rect x="30" y="92" width="940" height="178" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="55" y="122" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">1. Fuente se acerca · observador quieto</text>
<line x1="95" y1="188" x2="900" y2="188" stroke="#94a3b8" stroke-width="2"/>
<g stroke="#8b5cf6" stroke-width="3">
  <line x1="195" y1="145" x2="195" y2="230"/>
  <line x1="245" y1="145" x2="245" y2="230"/>
  <line x1="295" y1="145" x2="295" y2="230"/>
  <line x1="405" y1="145" x2="405" y2="230"/>
  <line x1="432" y1="145" x2="432" y2="230"/>
  <line x1="459" y1="145" x2="459" y2="230"/>
  <line x1="486" y1="145" x2="486" y2="230"/>
</g>
<rect x="345" y="163" width="48" height="50" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
<text x="369" y="245" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7c2d12">fuente</text>
<line x1="367" y1="150" x2="445" y2="150" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-source)"/>
<circle cx="800" cy="188" r="20" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
<text x="800" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#166534">quieto</text>
<text x="595" y="249" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">frentes comprimidos delante: λ disminuye, f recibida aumenta</text>

<rect x="30" y="282" width="940" height="178" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="55" y="312" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">2. Observador se acerca · fuente quieta</text>
<line x1="95" y1="378" x2="900" y2="378" stroke="#94a3b8" stroke-width="2"/>
<g stroke="#8b5cf6" stroke-width="3">
  <line x1="300" y1="335" x2="300" y2="420"/>
  <line x1="385" y1="335" x2="385" y2="420"/>
  <line x1="470" y1="335" x2="470" y2="420"/>
  <line x1="555" y1="335" x2="555" y2="420"/>
  <line x1="640" y1="335" x2="640" y2="420"/>
</g>
<rect x="230" y="353" width="48" height="50" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
<text x="254" y="435" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7c2d12">quieta</text>
<circle cx="710" cy="378" r="20" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
<line x1="700" y1="340" x2="615" y2="340" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-observer)"/>
<text x="710" y="418" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#166534">observador</text>
<text x="500" y="439" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">λ en el aire no cambia; el observador encuentra más frentes por segundo</text>

<rect x="30" y="472" width="940" height="178" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="55" y="502" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">3. Fuente y observador se alejan</text>
<line x1="95" y1="568" x2="900" y2="568" stroke="#94a3b8" stroke-width="2"/>
<g stroke="#8b5cf6" stroke-width="3">
  <line x1="270" y1="525" x2="270" y2="610"/>
  <line x1="300" y1="525" x2="300" y2="610"/>
  <line x1="330" y1="525" x2="330" y2="610"/>
  <line x1="410" y1="525" x2="410" y2="610"/>
  <line x1="465" y1="525" x2="465" y2="610"/>
  <line x1="520" y1="525" x2="520" y2="610"/>
</g>
<rect x="350" y="543" width="48" height="50" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
<line x1="370" y1="530" x2="300" y2="530" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-source)"/>
<text x="374" y="625" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7c2d12">fuente</text>
<circle cx="710" cy="568" r="20" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
<line x1="720" y1="530" x2="805" y2="530" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-observer)"/>
<text x="710" y="608" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#166534">observador</text>
<text x="520" y="631" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">se separan: menos frentes por segundo, f recibida disminuye</text>
<text x="500" y="680" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172033">En f_obs = f_s (v + v_o)/(v − v_s): acercarse es signo positivo.</text>
</svg>
