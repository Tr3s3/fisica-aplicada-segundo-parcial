<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Direcciones de los campos en una onda electromagnética</title>
<desc id="desc">El campo eléctrico apunta en y, el campo magnético en z y la propagación en x. Los tres son perpendiculares y E cruz B apunta en x.</desc>
<defs>
<marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245bdb"/></marker>
<marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e67e22"/></marker>
<marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#198754"/></marker>
</defs>
<rect width="900" height="440" rx="24" fill="#f8fafc"/>
<text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#172033">Campos perpendiculares y dirección de propagación</text>
<line x1="150" y1="230" x2="700" y2="230" stroke="#198754" stroke-width="5" marker-end="url(#arrowGreen)"/>
<text x="720" y="238" font-family="sans-serif" font-size="20" font-weight="700" fill="#198754">+x, k</text>
<line x1="420" y1="230" x2="420" y2="90" stroke="#245bdb" stroke-width="6" marker-end="url(#arrowBlue)"/>
<text x="440" y="106" font-family="sans-serif" font-size="21" font-weight="700" fill="#245bdb">E en +y</text>
<line x1="420" y1="230" x2="520" y2="130" stroke="#e67e22" stroke-width="6" marker-end="url(#arrowOrange)"/>
<text x="530" y="125" font-family="sans-serif" font-size="21" font-weight="700" fill="#e67e22">B en +z</text>
<circle cx="420" cy="230" r="8" fill="#172033"/>
<rect x="190" y="300" width="520" height="80" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="335" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#172033">E ⟂ B ⟂ k</text>
<text x="450" y="365" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">E × B apunta en la dirección de avance (+x)</text>
</svg>