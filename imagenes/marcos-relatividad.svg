<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Tiempo propio y contracción de longitud</title>
<desc id="desc">Dos eventos en el mismo lugar de la nave definen el tiempo propio. La Tierra mide un intervalo mayor. La longitud en reposo es mayor que la longitud contraída.</desc>
<rect width="900" height="500" rx="24" fill="#f8fafc"/>
<text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#172033">Primero identifica el marco que mide cada magnitud</text>
<rect x="35" y="68" width="830" height="225" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="104" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Tiempo entre dos eventos</text>
<line x1="100" y1="190" x2="800" y2="190" stroke="#64748b" stroke-width="3"/>
<rect x="140" y="150" width="150" height="70" rx="12" fill="#dbeafe" stroke="#245bdb" stroke-width="2"/>
<text x="215" y="181" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#12315a">marco de la nave</text>
<text x="215" y="207" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#12315a">A • reloj • B</text>
<text x="215" y="247" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#245bdb">Δt₀ = tiempo propio</text>
<line x1="390" y1="160" x2="690" y2="160" stroke="#e67e22" stroke-width="5"/>
<polygon points="690,160 674,151 674,169" fill="#e67e22"/>
<rect x="410" y="180" width="100" height="52" rx="8" fill="#ffedd5" stroke="#e67e22" stroke-width="2"/>
<rect x="635" y="180" width="100" height="52" rx="8" fill="#ffedd5" stroke="#e67e22" stroke-width="2"/>
<text x="460" y="213" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#7c2d12">evento A</text>
<text x="685" y="213" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#7c2d12">evento B</text>
<text x="560" y="260" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#b45309">Tierra: Δt = γ Δt₀  (mayor)</text>
<rect x="35" y="315" width="830" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="350" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Longitud paralela al movimiento</text>
<text x="85" y="399" font-family="sans-serif" font-size="18" fill="#172033">En reposo:</text>
<line x1="205" y1="393" x2="510" y2="393" stroke="#245bdb" stroke-width="12" stroke-linecap="round"/>
<text x="355" y="430" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#245bdb">L₀ (propia)</text>
<text x="560" y="399" font-family="sans-serif" font-size="18" fill="#172033">En movimiento:</text>
<line x1="690" y1="393" x2="810" y2="393" stroke="#e67e22" stroke-width="12" stroke-linecap="round"/>
<text x="750" y="430" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#b45309">L = L₀/γ</text>
</svg>