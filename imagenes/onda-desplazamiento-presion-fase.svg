<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Desfase entre desplazamiento y presión en una onda sonora</title>
  <desc id="desc">Dos gráficas espaciales de una onda sinusoidal en un mismo instante. El desplazamiento y la presión acústica están desfasados un cuarto de longitud de onda. Una compresión coincide con presión positiva máxima; una rarefacción con presión negativa máxima.</desc>
  <rect width="1000" height="650" rx="24" fill="#f8fafc"/>
  <text x="500" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#172033">Desplazamiento y presión están desfasados un cuarto de ciclo</text>
  <text x="500" y="76" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Perfiles a lo largo de x en el mismo instante · la onda avanza hacia +x</text>

  <text x="75" y="161" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">Desplazamiento s(x)</text>
  <line x1="170" y1="220" x2="830" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="140" x2="170" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M170 160 C225 160 225 280 280 280 S335 160 390 160 S445 280 500 280 S555 160 610 160 S665 280 720 280 S775 160 830 160" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="150" y="165" text-anchor="end" font-family="sans-serif" font-size="16" fill="#1d4ed8">+sₘₐₓ</text>
  <text x="150" y="286" text-anchor="end" font-family="sans-serif" font-size="16" fill="#1d4ed8">−sₘₐₓ</text>

  <text x="75" y="361" font-family="sans-serif" font-size="21" font-weight="700" fill="#b91c1c">Variación de presión Δp(x)</text>
  <line x1="170" y1="430" x2="830" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="350" x2="170" y2="510" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M170 430 C225 430 225 370 280 370 S335 430 390 430 S445 490 500 490 S555 430 610 430 S665 370 720 370 S775 430 830 430" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="150" y="377" text-anchor="end" font-family="sans-serif" font-size="16" fill="#b91c1c">+Δpₘₐₓ</text>
  <text x="150" y="496" text-anchor="end" font-family="sans-serif" font-size="16" fill="#b91c1c">−Δpₘₐₓ</text>

  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="170" y1="210" x2="170" y2="530"/>
    <line x1="335" y1="210" x2="335" y2="530"/>
    <line x1="500" y1="210" x2="500" y2="530"/>
    <line x1="665" y1="210" x2="665" y2="530"/>
    <line x1="830" y1="210" x2="830" y2="530"/>
  </g>
  <g fill="#334155" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="170" y="558">0</text>
    <text x="335" y="558">λ/4</text>
    <text x="500" y="558">λ/2</text>
    <text x="665" y="558">3λ/4</text>
    <text x="830" y="558">λ</text>
  </g>
  <rect x="256" y="571" width="165" height="34" rx="10" fill="#fee2e2"/>
  <text x="338" y="594" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#991b1b">compresión</text>
  <rect x="586" y="571" width="158" height="34" rx="10" fill="#dbeafe"/>
  <text x="665" y="594" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">rarefacción</text>
  <text x="500" y="631" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">La separación entre crestas de una misma curva es λ; entre las dos curvas hay λ/4 de desfase.</text>
</svg>
