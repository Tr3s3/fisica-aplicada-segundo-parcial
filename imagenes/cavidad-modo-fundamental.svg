  <text x="169" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9b2c24">nodo</text>
  <text x="450" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8a5a00">máximo</text>
  <text x="731" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9b2c24">nodo</text>
  <line x1="169" y1="324" x2="731" y2="324" stroke="#9ca3af" stroke-width="2"/>
  <path d="M169 324 C260 324 300 396 356 396 C410 396 430 324 450 324 C470 324 490 396 544 396 C600 396 640 324 731 324" fill="none" stroke="#198754" stroke-width="6"/>
