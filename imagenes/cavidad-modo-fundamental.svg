<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Modo fundamental de una onda electromagnética entre paredes conductoras</title>
  <desc id="desc">La amplitud del campo eléctrico tiene nodos en las dos paredes y un máximo en el centro. La amplitud del campo magnético tiene máximos en las paredes y un nodo central. La separación entre paredes es media longitud de onda.</desc>
